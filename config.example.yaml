# Example hub configuration — synthetic names only (ADR 0007).
# The real file lives on the server and is never committed; see docs/specs/hub-config.md.
#
# Every key here is optional except `nodes`: what is omitted falls back to the product
# defaults compiled into the hub. Tokens are read from the environment, one variable per
# node, and are never written in this file.

base_tick: 5m
filesystems: [apfs, ext4, xfs, btrfs, zfs, ntfs]

# The version every node's update timer installs: latest, or one version such as 1.4.0, here
# or per class or node. Absent, nodes install nothing (docs/decisions/0028).
# agent_target: latest

# Mount points not worth watching. An empty list watches everything the allow-list admits.
skip_mounts: ["/System/Volumes/", "/Library/Developer/CoreSimulator/"]

sensors:
  disk: { interval: 15m }

# Thresholds are a floor plus a proportional band, and a volume declared role: backup keeps
# headroom only. See docs/specs/evaluation.md; every number here is a product default.
rules:
  disk:
    warning:  { floor: 10GB, ratio: 15, ceiling: 100GB }
    critical: { floor: 4GB,  ratio: 7,  ceiling: 40GB }
    backup:
      warning:  { floor: 50GB }
      critical: { floor: 10GB }

# When the daily digest goes out, in the zone the deployment names — never the host's, so
# moving the hub cannot move the hour. The Telegram bot token and chat id are read from
# MONITOR_TELEGRAM_TOKEN and MONITOR_TELEGRAM_CHAT_ID and never written in a file.
digest: { at: "09:00", timezone: UTC }
notify: { channel: log, locale: en }

classes:
  laptop:
    profile: [disk]
    silence_after: 48h
    sensors:
      disk: { interval: 1h }
  server:
    profile: [disk]
    silence_after: 10m

nodes:
  laptop-a:
    class: laptop
    token_env: MONITOR_TOKEN_LAPTOP_A
  server-b:
    class: server
    token_env: MONITOR_TOKEN_SERVER_B
    sensors:
      disk: { interval: 5m }
    volumes:
      "/data/backup": { role: backup }
