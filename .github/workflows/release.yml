# Publishing rules from docs/specs/release.md. A tag is the only trigger, and a run either
# publishes eight files or publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]

# Only the job that publishes may write, and only it sees the signing key.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The grammar itself is deploy/tag-version.sh, which the test suite covers.
      - name: The tag names a version
        id: tag
        run: |
          version=$(deploy/tag-version.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag is what makes the project sign, so what it may name is narrower than what a
      # branch may hold. Releasing a hotfix means merging it first.
      - name: The commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing $GITHUB_SHA: it is not on main" >&2
            exit 1
          fi

      # A fast check with a read-scoped token, which cannot see drafts: the refusal that
      # actually binds is in the publish job, where the token can see them.
      - name: No published release exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "refusing $GITHUB_REF_NAME: it already has a release" >&2
            exit 1
          fi

  build-linux:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A green boundary of main is not a promise that today's main is green (ADR 0011), and
      # a weaker suite here than the merge gate's would undercut re-running it.
      - name: go test
        run: go test -race ./...

      - name: Build the static binaries
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir dist
          for command in agent hub; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
                -ldflags "-X github.com/pravbeseda/monitor/internal/version.Current=$VERSION" \
                -o "dist/monitor-$command-$VERSION-linux-$arch" "./cmd/$command"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          if-no-files-found: error
          overwrite: true

  build-darwin:
    needs: guard
    # The darwin half of the disk sensor is cgo (ADR 0014), so only a macOS runner compiles
    # it; the amd64 slice cross-compiles from the arm64 runner with the same toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test
        run: go test -race ./...

      - name: Build the agent for both Macs
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir dist
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" go build \
              -ldflags "-X github.com/pravbeseda/monitor/internal/version.Current=$VERSION" \
              -o "dist/monitor-agent-$VERSION-darwin-$arch" ./cmd/agent
          done

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [guard, build-linux, build-darwin]
    runs-on: ubuntu-latest
    # The signing key is a secret of this environment, not of the repository, and the
    # environment's policy admits `v*` tags alone: no workflow on a branch can read it. What
    # signs is a v* tag on a commit the guard found on main (docs/specs/release.md#the-key).
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Pinned by commit, because these two run beside the signing key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      - name: The six assets are all here
        run: |
          cd dist
          for asset in \
            "monitor-agent-$VERSION-linux-amd64" \
            "monitor-agent-$VERSION-linux-arm64" \
            "monitor-agent-$VERSION-darwin-amd64" \
            "monitor-agent-$VERSION-darwin-arm64" \
            "monitor-hub-$VERSION-linux-amd64" \
            "monitor-hub-$VERSION-linux-arm64"; do
            [ -f "$asset" ] || { echo "missing $asset" >&2; exit 1; }
          done
          [ "$(ls | wc -l)" -eq 6 ] || { echo "dist holds more than the six assets" >&2; ls >&2; exit 1; }

      # A draft owns no tag, so one left by a run that died mid-upload would make the tag
      # ambiguous and could be published in place of this run's.
      - name: No release, published or draft, exists for this tag
        run: |
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "true" ]; then
              gh release delete "$GITHUB_REF_NAME" --yes
            else
              echo "refusing $GITHUB_REF_NAME: it already has a published release" >&2
              exit 1
            fi
          fi

      # The manifest is what the signature covers, so a name and a digest are signed
      # together and an asset is genuine only under the name this release gave it.
      - name: Write and sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          # $RUNNER_TEMP is outside the workspace, so nothing that collects files from there
          # can collect the key.
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing-key.priv"
          cd dist
          sha256sum monitor-* > SHA256SUMS
          openssl dgst -sha256 -sign "$RUNNER_TEMP/signing-key.priv" -out SHA256SUMS.sig SHA256SUMS

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.priv"

      # Verified with the key committed in the repository, never with one derived from the
      # secret: a rotated secret whose public half was not committed must fail here rather
      # than produce a release no node can verify. It is a self-check of this run, not a
      # defence against the commit being tagged.
      - name: Verify every asset as a node would
        run: |
          for asset in dist/monitor-*; do
            deploy/verify-release.sh --key deploy/release-signing-key.pub "$asset"
          done

      # Created as a draft and published in one call at the end, once all eight files are
      # attached: no client sees a release holding half of them.
      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*
          attached=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          [ "$attached" -eq 8 ] || { echo "the draft holds $attached assets, not 8" >&2; exit 1; }
          # make_latest=legacy rather than gh's --latest: runs for two tags pushed together
          # can finish in either order, and "latest" must be the higher version rather than
          # whichever run got here last. GitHub does that comparison itself.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "map(select(.tag_name == \"$GITHUB_REF_NAME\"))[0].id")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=legacy --jq .html_url
