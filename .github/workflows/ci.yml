# Quality gates from docs/decisions/0011-quality-gates.md. A red check blocks the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The darwin half of the disk sensor is cgo (ADR 0014); only a macOS runner compiles it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: go test
        run: go test -race -cover ./...

      # The install script is POSIX sh, so -s sh checks it as its shebang claims and as
      # Debian's /bin/sh (dash) will read it. Ubuntu only: the lint does not vary by runner,
      # and shellcheck is part of the GitHub-hosted Ubuntu image while nothing promises it
      # on the macOS one — installing it there would spend a brew download on a duplicate.
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck -s sh deploy/install-agent.sh deploy/verify-release.sh \
            deploy/tag-version.sh .githooks/pre-commit
