{{ define "shell" }}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111418'/%3E%3Cpolyline points='3,17 9,17 12,8 16,25 20,12 23,17 29,17' fill='none' stroke='%233fb950' stroke-width='3.2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111418;
      --fg: #d8dde3;
      --muted: #8b949e;
      --faint: #6e7681;
      --rule: #2d333b;
      --grid: #1f242b;
      --link: #6cb6ff;
      --accent: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --notice-bg: #3d2e00;
      --notice-fg: #f2cc60;
    }
    body { background: var(--bg); color: var(--fg); }
    a { color: var(--link); }
    nav.tabs { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0 0 1.5rem; border-bottom: 1px solid var(--rule); }
    nav.tabs a.tab { padding: 0.4rem 0.8rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    nav.tabs a.tab:hover { color: var(--fg); }
    nav.tabs a.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
    p.notice { color: var(--warn); }
    .level-ok { color: var(--accent); }
    .level-warning { color: var(--warn); }
    .level-critical { color: var(--bad); font-weight: 600; }
  </style>
  {{ if .Live }}<meta name="monitor-live" content="{{ .StalledNotice }}" data-rendering="{{ .Rendering }}">{{ end }}
  <script>
    (function () {
      // A click on a tab is the reader choosing a skin, which `/` opens from then on; the
      // page stores it and the hub only reads it, as with the zone (ADR 0037). Listening on
      // the document outlives the body a refresh swaps in.
      document.addEventListener("click", function (event) {
        var tab = event.target.closest && event.target.closest("a.tab[data-skin]");
        if (!tab) return;
        try {
          document.cookie = "skin=" + tab.getAttribute("data-skin") + "; path=/; max-age=31536000; samesite=lax" +
            (location.protocol === "https:" ? "; secure" : "");
        } catch (e) {}
      });

      // The reader's time zone is the one thing the server cannot know (ADR 0026): state it,
      // then fetch the page again in it. The cookie is read back first, so a browser that
      // will not store it keeps the UTC page instead of fetching forever. reload() keeps the
      // address whole, fragment included, where replacing it would only jump to the anchor.
      if (stateZone()) {
        location.reload();
        return;
      }

      // An open page fetches its own address and swaps in the answer's body when it
      // changed, so the document and its scroll position stay (ADR 0029).
      var period = 30000;
      var marker = 'meta[name="monitor-live"]';
      var mine = document.querySelector(marker);
      if (!mine || !window.fetch || !window.DOMParser || !window.AbortController) return;
      var shown = null;
      var stalled = false;
      var inFlight = false;
      var halted = false;
      var leaving = false;
      var next;

      function refresh() {
        if (inFlight || halted) return;
        clearTimeout(next);
        if (document.visibilityState !== "visible") return;
        inFlight = true;
        stateZone();
        var started = performance.now();
        // A slow answer is waited for, since an abort would also dismiss a credential prompt
        // and bring it back on the next refresh; only one that never comes, on a connection
        // that died, is given up on, so the page recovers when the hub is back.
        var late = setTimeout(stall, period / 2);
        var abort = new AbortController();
        var dead = setTimeout(function () { abort.abort(); }, 4 * period);
        fetch(location.href, { cache: "no-store", credentials: "same-origin", signal: abort.signal })
          .then(function (answer) {
            // A refused credential would bring the browser's prompt back every period, so
            // refreshing stops until the reader reloads the page by hand.
            if (answer.status === 401) halted = true;
            if (answer.status === 401 || answer.status >= 500 || answer.redirected) throw answer.status;
            return answer.text();
          })
          .then(function (html) {
            var page = new DOMParser().parseFromString(html, "text/html");
            var theirs = page.querySelector(marker);
            if (!theirs) throw "not a hub page";
            if (theirs.getAttribute("data-rendering") !== mine.getAttribute("data-rendering")) {
              location.reload();
              return;
            }
            var body = page.body.innerHTML;
            if (stalled || body !== (shown === null ? document.body.innerHTML : shown)) {
              document.body.replaceWith(page.body);
            }
            shown = body;
            stalled = false;
          })
          .catch(stall)
          .then(function () {
            clearTimeout(late);
            clearTimeout(dead);
            inFlight = false;
            if (!halted) next = setTimeout(refresh, Math.max(0, period - (performance.now() - started)));
          });
      }

      // The page stays as it was, under a notice: the last good numbers with a warning are
      // worth more than an error in their place. A fetch the browser cancels because the
      // reader is leaving is not a failure.
      function stall() {
        if (leaving) return;
        stalled = true;
        if (document.getElementById("monitor-stalled")) return;
        var notice = document.createElement("p");
        notice.id = "monitor-stalled";
        notice.setAttribute("role", "status");
        notice.textContent = mine.getAttribute("content");
        notice.style.cssText = "position: sticky; top: 0; margin: 0 0 1rem; padding: 0.4rem 0.6rem;" +
          " background: var(--notice-bg); color: var(--notice-fg); font-size: 0.9rem;";
        document.body.insertBefore(notice, document.body.firstChild);
      }

      next = setTimeout(refresh, period);
      document.addEventListener("visibilitychange", refresh);
      window.addEventListener("pagehide", function () {
        leaving = true;
      });
      window.addEventListener("pageshow", function (event) {
        leaving = false;
        if (event.persisted) refresh();
      });

      // stateZone writes the browser's zone into the cookie when it differs, and answers
      // whether the cookie now holds it. A browser that refuses to answer about its zone or
      // its cookies reads UTC.
      function stateZone() {
        try {
          var zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
          if (!zone || holds(zone)) return false;
          document.cookie = "tz=" + zone + "; path=/; max-age=31536000; samesite=lax" +
            (location.protocol === "https:" ? "; secure" : "");
          return holds(zone);
        } catch (e) {
          return false;
        }
      }
      function holds(zone) {
        return document.cookie.split("; ").indexOf("tz=" + zone) >= 0;
      }
    })();
  </script>
{{ end }}

{{ define "tabs" }}
  <nav class="tabs">{{ range .Tabs }}<a class="tab" href="{{ .URL }}" data-skin="{{ .Skin }}"{{ if .Open }} aria-current="page"{{ end }}>{{ .Label }}</a>{{ end }}</nav>
{{ end }}
